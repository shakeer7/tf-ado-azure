# Azure DevOps Multi-Environment Pipeline for Dev and Staging with OPA Integration
# Configured for Self-Hosted Agent Pools (e.g. 'Default')
name: $(Build.DefinitionName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - feature/*
  paths:
    include:
      - dev/**
      - stage/**
      - modules/**
      - policy/**
      - pipelines/**

pr:
  branches:
    include:
      - main

variables:
  - name: AGENT_POOL
    value: 'Default' # Name of your self-hosted agent pool (change if different)
  - name: TERRAFORM_VERSION
    value: '1.15.0'
  - name: SERVICE_CONNECTION
    value: 'Azure-Service-Connection'
  - name: STATE_RESOURCE_GROUP
    value: 'rg-tf-state'
  - name: STATE_STORAGE_ACCOUNT
    value: 'tfstateazfree01'
  - name: STATE_CONTAINER
    value: 'tfstate'

stages:
# -------------------------------------------------------------
# STAGE 1: Code Quality, Format & Linting
# -------------------------------------------------------------
- stage: Validate
  displayName: "Validate & Lint"
  jobs:
  - job: lint_and_validate
    displayName: "Terraform Format & Validate"
    pool:
      name: $(AGENT_POOL)
    steps:
    - task: TerraformInstaller@0
      displayName: "Install Terraform $(TERRAFORM_VERSION)"
      inputs:
        terraformVersion: $(TERRAFORM_VERSION)

    - script: |
        echo "Checking code format..."
        terraform fmt -check -recursive
      displayName: "Verify Terraform Code Format"

# -------------------------------------------------------------
# STAGE 2: Dev Environment (Plan -> OPA Policy Gate -> Apply)
# -------------------------------------------------------------
- stage: Dev_Deploy
  displayName: "Dev Environment"
  dependsOn: Validate
  condition: succeeded()
  jobs:
  - deployment: dev_pipeline
    displayName: "Deploy to Dev"
    environment: 'dev'
    pool:
      name: $(AGENT_POOL)
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@0
            displayName: "Install Terraform $(TERRAFORM_VERSION)"
            inputs:
              terraformVersion: $(TERRAFORM_VERSION)

          - script: |
              echo "Verifying OPA CLI availability..."
              if command -v opa &> /dev/null; then
                opa version
              elif [ -f "/usr/local/bin/opa" ]; then
                /usr/local/bin/opa version
              else
                echo "Downloading OPA binary for agent..."
                curl -s -L -o /usr/local/bin/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static 2>/dev/null || curl -s -L -o opa.exe https://openpolicyagent.org/downloads/latest/opa_windows_amd64.exe
                chmod 755 /usr/local/bin/opa 2>/dev/null || true
              fi
            displayName: "Ensure OPA CLI Available"

          - task: TerraformTaskV4@4
            displayName: "Terraform Init (Dev)"
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/dev'
              backendServiceArm: $(SERVICE_CONNECTION)
              backendAzureRmResourceGroupName: $(STATE_RESOURCE_GROUP)
              backendAzureRmStorageAccountName: $(STATE_STORAGE_ACCOUNT)
              backendAzureRmContainerName: $(STATE_CONTAINER)
              backendAzureRmKey: 'dev.terraform.tfstate'

          - task: TerraformTaskV4@4
            displayName: "Terraform Plan (Dev)"
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/dev'
              environmentServiceNameAzureRM: $(SERVICE_CONNECTION)
              commandOptions: '-var-file="terraform.tfvars" -out=tfplan.binary'

          - script: |
              cd $(System.DefaultWorkingDirectory)/dev
              terraform show -json tfplan.binary > tfplan.json
              echo "Evaluating Dev Plan against OPA Policies..."
              chmod +x ../policy/evaluate-policy.sh 2>/dev/null || true
              bash ../policy/evaluate-policy.sh tfplan.json ../policy
            displayName: "OPA Policy Gate (Dev)"

          - task: TerraformTaskV4@4
            displayName: "Terraform Apply (Dev)"
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/dev'
              environmentServiceNameAzureRM: $(SERVICE_CONNECTION)
              commandOptions: 'tfplan.binary'

# -------------------------------------------------------------
# STAGE 3: Staging Environment (Plan -> OPA Policy Gate -> Apply)
# -------------------------------------------------------------
- stage: Stage_Deploy
  displayName: "Staging Environment"
  dependsOn: Dev_Deploy
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: stage_pipeline
    displayName: "Deploy to Staging"
    environment: 'stage'
    pool:
      name: $(AGENT_POOL)
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@0
            displayName: "Install Terraform $(TERRAFORM_VERSION)"
            inputs:
              terraformVersion: $(TERRAFORM_VERSION)

          - script: |
              echo "Verifying OPA CLI availability..."
              if command -v opa &> /dev/null; then
                opa version
              elif [ -f "/usr/local/bin/opa" ]; then
                /usr/local/bin/opa version
              else
                echo "Downloading OPA binary for agent..."
                curl -s -L -o /usr/local/bin/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static 2>/dev/null || curl -s -L -o opa.exe https://openpolicyagent.org/downloads/latest/opa_windows_amd64.exe
                chmod 755 /usr/local/bin/opa 2>/dev/null || true
              fi
            displayName: "Ensure OPA CLI Available"

          - task: TerraformTaskV4@4
            displayName: "Terraform Init (Stage)"
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/stage'
              backendServiceArm: $(SERVICE_CONNECTION)
              backendAzureRmResourceGroupName: $(STATE_RESOURCE_GROUP)
              backendAzureRmStorageAccountName: $(STATE_STORAGE_ACCOUNT)
              backendAzureRmContainerName: $(STATE_CONTAINER)
              backendAzureRmKey: 'stage.terraform.tfstate'

          - task: TerraformTaskV4@4
            displayName: "Terraform Plan (Stage)"
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/stage'
              environmentServiceNameAzureRM: $(SERVICE_CONNECTION)
              commandOptions: '-var-file="terraform.tfvars" -out=tfplan.binary'

          - script: |
              cd $(System.DefaultWorkingDirectory)/stage
              terraform show -json tfplan.binary > tfplan.json
              echo "Evaluating Staging Plan against OPA Policies..."
              chmod +x ../policy/evaluate-policy.sh 2>/dev/null || true
              bash ../policy/evaluate-policy.sh tfplan.json ../policy
            displayName: "OPA Policy Gate (Stage)"

          - task: TerraformTaskV4@4
            displayName: "Terraform Apply (Stage)"
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/stage'
              environmentServiceNameAzureRM: $(SERVICE_CONNECTION)
              commandOptions: 'tfplan.binary'
